services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plot-twist
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    # Pinned to a free community release. The :latest tag now resolves to a
    # Pro-licensed build that fails to start without LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:3
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: "1"
      S3_BUCKET_AVATARS: plot-twist-avatars
      WEB_ORIGINS: http://localhost:3000,http://localhost:4200,http://127.0.0.1:3000,http://127.0.0.1:4200
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket plot-twist-avatars || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3333:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: plot-twist
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      JWT_SECRET: "plot-twist-dev-jwt-secret-change-in-production"
      RESEND_API_KEY: "re_test_placeholder"
      RESEND_FROM_ADDRESS: "Plot-Twist <onboarding@resend.dev>"
      PASSWORD_RESET_URL: "http://localhost:4200/reset-password"
      S3_REGION: us-east-1
      S3_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET_AVATARS: plot-twist-avatars
      MAX_AVATAR_SIZE_BYTES: "2097152"
      MAX_AVATAR_DIMENSION: "2048"
      AVATAR_ALLOWED_MIME: "image/jpeg,image/png,image/webp"
      PRESIGNED_POST_TTL_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4200:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  localstack_data:
